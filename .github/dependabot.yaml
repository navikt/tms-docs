version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.READER_TOKEN }}
updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries: "*"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    ignore:
      # @astrojs/node >=9.4.4 kaller app.getAllowedDomains(), som ikke finnes i
      # astro 5.13.x. Det gir HTTP 500 på alle SSR-ruter (inkl. helsesjekkene) og
      # bryter deploy. Fjern pinningen når vi oppgraderer astro/adapter sammen.
      - dependency-name: "@astrojs/node"
        versions: [">=9.4.4"]
    cooldown:
      default-days: 7
    groups:
      navikt:
        patterns:
          - "@navikt/*"
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      minor-and-patch:
        update-types:
          - "patch"
          - "minor"
        exclude-patterns:
          - "@navikt/ds-*" # midlertidig ekskludering av ds-oppdateringer inntil vi får inn ds-css
